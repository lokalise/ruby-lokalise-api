name: CI

on:
  pull_request:

  push:
    branches: [ master ]

permissions:
  contents: read
  
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
    runs-on: ${{ matrix.os }}
    env:
      LOKALISE_API_TOKEN: 123abc
      OAUTH2_CLIENT_ID: fake
      OAUTH2_CLIENT_SECRET: fake
      OAUTH2_TOKEN: fake
      OAUTH2_REFRESH_TOKEN: fake
      OAUTH2_CODE: fake
      OAUTH2_TOKEN_REFRESHED: fake
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Ruby
      uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: bundle exec rake spec
    - uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5
      if: matrix.ruby == '4.0'
      with:
        token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
        files: coverage/.resultset.json